name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Fixed refs checked during candidate preparation; updating requires review.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Offline unit tests and artificial path-boundary fixtures
        run: python -B -m unittest discover -s scripts -p "test_*.py"

      - name: Validate complete package and internal references
        run: python -B scripts/validate_skill.py --json

      # This workflow does not claim browser/LLM behavior or host import acceptance.
      # No automatic tag, release, upload, or repository metadata write is performed.
